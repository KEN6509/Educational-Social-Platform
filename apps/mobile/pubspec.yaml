name: cyanzone_mobile
description: AI-assisted parent-supervised educational social platform for teenagers.
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_dotenv: ^5.2.1
  go_router: ^14.6.2
  geolocator: ^14.0.3
  shared_preferences: ^2.5.3
  supabase_flutter: ^2.8.2
  image: ^4.8.0
  image_picker: ^1.2.2
  path_provider: ^2.1.5
  photo_manager: ^3.7.1
  flutter_staggered_grid_view: ^0.7.0
  flutter_map: ^8.3.2
  latlong2: ^0.10.1
  http: ^1.6.0
  firebase_core: ^4.14.0
  firebase_messaging: ^16.6.0
  flutter_local_notifications: ^22.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.3

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/app_icon.png"
  min_sdk_android: 21
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/images/app_icon.png"

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/images/logo.png
    - assets/images/logo_transparent.png
    - assets/images/app_icon.png
    - .env
